<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Login | Sigma Academy</title>
    <link rel="stylesheet" href="style.css">

    <style>
        .teacher-login {
            max-width: 430px;
            margin: 70px auto;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.10);
        }

        .teacher-login h2 {
            text-align: center;
            color: #101d3a;
            margin-bottom: 10px;
        }

        .teacher-login p {
            text-align: center;
            margin-bottom: 25px;
        }

        .teacher-login input {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .teacher-login button {
            width: 100%;
            border: none;
            cursor: pointer;
            margin-top: 15px;
        }

        .teacher-login a {
            display: block;
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <header class="navbar">
        <a href="index.html" class="logo">
            SIGMA<span> ACADEMY</span>
        </a>
        <a href="login.html" class="login-btn">Back</a>
    </header>

    <div class="teacher-login">

        <h2>Teacher Login</h2>
        <p>Welcome to Sigma Academy Teacher Panel</p>

        <form id="teacherForm">

            <input
                type="text"
                id="teacherId"
                placeholder="Teacher ID"
                required
            >

            <input
                type="password"
                id="teacherPassword"
                placeholder="Password"
                required
            >

            <button type="submit" class="primary-btn">
                Login as Teacher
            </button>

        </form>

        <a href="login.html">← Back to Login Selection</a>

    </div>

    <footer>
        <h3>SIGMA ACADEMY</h3>
        <p>জ্ঞান হোক দীপ্ত, ভবিষ্যৎ হোক উদ্ভাসিত।</p>
    </footer>

    <script>
        document.getElementById("teacherForm").addEventListener("submit", function(event) {
            event.preventDefault();
            alert("Teacher authentication will be connected securely with Firebase in the next phase.");
        });
    </script>

</body>
</html>
